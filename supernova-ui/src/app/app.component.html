<div class="app-layout" [class.copilot-docked]="copilotDocked" [class.copilot-wide]="copilotWide">
  <!-- Sol sidebar — yalnızca login değilse -->
  <app-navigation *ngIf="showNavigation"></app-navigation>

  <!-- Ana içerik: sidebar flex kardeşi, tam genişlik -->
  <main class="content-area" [class.no-nav]="!showNavigation">
    <router-outlet></router-outlet>
  </main>

  <app-confirm-dialog></app-confirm-dialog>
  <app-ai-copilot (dockChange)="copilotDocked = $event" (wideChange)="copilotWide = $event"></app-ai-copilot>
</div>
